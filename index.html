<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>パニックDEパニック</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f0f4;color:#403747;font-family:system-ui,sans-serif}.app{max-width:760px;margin:auto;padding:12px}h1{font-size:22px;margin:6px 0 2px}.tagline{font-size:12px;color:#756b78;margin:0 0 10px}.tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}button{border:1px solid #bba5b5;background:white;border-radius:9px;padding:10px 12px;font-size:14px}select{padding:8px;border-radius:8px;border:1px solid #bba5b5;background:white}.count{display:flex;align-items:center;gap:5px;font-size:13px}button.active{background:#9b5c86;color:white}canvas{display:block;width:100%;height:min(72vh,740px);background:#fffafd;border:2px solid #b9a8b7;border-radius:12px;touch-action:none}p{font-size:12px;line-height:1.5}</style></head><body><div class="app"><h1>パニックDEパニック</h1><p class="tagline">動きを見て、道を作って楽しむ機能性玩具｜ver.1.1</p><div class="tools"><button data-mode="erase">消しゴム</button><button data-mode="pen">自由ペン</button><button data-mode="in">入口ドアを置く</button><button data-mode="out">出口ドアを置く</button><button data-mode="move">ドアを動かす</button><button id="restore">床を元通り</button><button id="resetAll">すべて初期化</button><button id="pause">一時停止</button><label class="count">ボール数 <select id="ballCount"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label><button id="clear">描いた線を消す</button></div><canvas id="c"></canvas><p>ペン・消しゴムは指でなぞります。入口・出口ボタンの後に置きたい場所をタップし、「ドアを動かす」で移動できます。ボールは床の穴を通り、線のある床で跳ねます。重力や道づくりを観察して楽しむ機能性玩具です。医療機器・治療用アプリではありません。</p></div><script>
(()=>{'use strict';const c=document.getElementById('c'),ctx=c.getContext('2d');let W=0,H=0,scale=1,paused=false,mode='erase',pointer=null,last=null,strokes=[],doors={in:null,out:null},balls=[],lastTime=0;const N=7,gravity=750,LINE=5,ERASER=LINE*1.2;let floorCuts=[];const colors=['#d67c7c','#69a3aa','#c79b40','#8479c4','#76a176','#e09a64','#6797c8','#b784ad'];const margin=28;function bounds(){return{left:margin,right:W-margin,top:30,bottom:H-30,row:(H-60)/N}}function floorY(i){const g=bounds();return g.top+(i+1)*g.row}function initialGap(i){const g=bounds(),width=Math.max(45,W*.12);return i%2===0?[g.right-width,g.right]:[g.left,g.left+width]}function resetCuts(){floorCuts=Array.from({length:N},()=>[])}function resize(){const r=c.getBoundingClientRect(),oldW=W,oldH=H;W=r.width;H=r.height;const dpr=Math.min(2,devicePixelRatio||1);c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(oldW){const sx=W/oldW,sy=H/oldH;strokes.forEach(s=>s.pts.forEach(p=>{p.x*=sx;p.y*=sy}));doors.in&& (doors.in.x*=sx,doors.in.y*=sy);doors.out&&(doors.out.x*=sx,doors.out.y*=sy);balls.forEach(b=>{b.x*=sx;b.y*=sy});floorCuts=floorCuts.map(row=>row.map(q=>[q[0]*sx,q[1]*sx]))}}function initBalls(){const g=bounds();balls=Array.from({length:Number(document.getElementById("ballCount").value)},(_,i)=>({x:g.left+65+(i%3)*28,y:g.top+10+i*12,vx:(i%2?35:-20),vy:0,r:7+i%3*3,color:colors[i],lock:0}))}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function doorSize(){return{w:Math.max(35,W*.095),h:Math.max(28,H*.052)}}function placeDoor(kind,x,y){const g=bounds(),d=doorSize(),pad=17;doors[kind]={x:clamp(x,g.left+pad+d.w/2,g.right-pad-d.w/2),y:clamp(y,g.top+pad+d.h/2,g.bottom-pad-d.h/2)}}function point(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function segDist(px,py,a,b){const dx=b.x-a.x,dy=b.y-a.y,t=clamp(((px-a.x)*dx+(py-a.y)*dy)/(dx*dx+dy*dy||1),0,1);return Math.hypot(px-a.x-dx*t,py-a.y-dy*t)}function erase(x,y){for(let i=0;i<N;i++){const yy=floorY(i);if(Math.abs(y-yy)<=LINE/2+ERASER/2){floorCuts[i].push([x-ERASER/2,x+ERASER/2])}}for(const s of strokes){if(!s.pts.length)continue;const next=[];let part=[];const step=2;for(let i=0;i<s.pts.length-1;i++){const a=s.pts[i],b=s.pts[i+1],n=Math.max(1,Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/step));for(let j=0;j<n;j++){const p={x:a.x+(b.x-a.x)*j/n,y:a.y+(b.y-a.y)*j/n};if(Math.hypot(p.x-x,p.y-y)<=LINE/2+ERASER/2){if(part.length>1)next.push(part);part=[]}else part.push(p)}}if(s.pts.length)part.push(s.pts.at(-1));if(part.length>1)next.push(part);s.parts=next}strokes=strokes.flatMap(s=>(s.parts||[s.pts]).map(pts=>({pts})).filter(s=>s.pts.length>1))}function trace(a,b,fn){const n=Math.max(1,Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/2));for(let i=1;i<=n;i++)fn(a.x+(b.x-a.x)*i/n,a.y+(b.y-a.y)*i/n)}function nearDoor(p,d){if(!d)return false;const z=doorSize();return Math.abs(p.x-d.x)<=z.w/2+8&&Math.abs(p.y-d.y)<=z.h/2+8}c.addEventListener('pointerdown',e=>{e.preventDefault();const p=point(e);pointer={id:e.pointerId,mode,door:null};last=p;c.setPointerCapture(e.pointerId);if(mode==='erase')erase(p.x,p.y);if(mode==='pen')strokes.push({pts:[p]});if(mode==='in'||mode==='out'){placeDoor(mode,p.x,p.y);pointer=null}if(mode==='move'){pointer.door=nearDoor(p,doors.in)?'in':nearDoor(p,doors.out)?'out':null}});c.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;const p=point(e);if(pointer.mode==='erase')trace(last,p,erase);if(pointer.mode==='pen')strokes.at(-1).pts.push(p);if(pointer.mode==='move'&&pointer.door)placeDoor(pointer.door,p.x,p.y);last=p});function end(e){if(pointer&&pointer.id===e.pointerId){if(pointer.mode==='pen')strokes.at(-1).pts.push(point(e));pointer=null}}c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(q=>q.classList.toggle('active',q===b))});document.querySelector('[data-mode="erase"]').classList.add('active');document.getElementById('restore').onclick=resetCuts;document.getElementById('clear').onclick=()=>strokes=[];document.getElementById('ballCount').onchange=initBalls;document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'再開':'一時停止'};document.getElementById('resetAll').onclick=()=>{resetCuts();strokes=[];doors={in:null,out:null};initBalls()};
function segments(){const g=bounds(),out=[];for(let i=0;i<N;i++){const y=floorY(i),gaps=[initialGap(i),...floorCuts[i]].sort((a,b)=>a[0]-b[0]);let cur=g.left;for(const [a,b] of gaps){if(a>cur)out.push([{x:cur,y},{x:Math.min(a,g.right),y}]);cur=Math.max(cur,b)}if(cur<g.right)out.push([{x:cur,y},{x:g.right,y}])}for(const s of strokes)for(let i=1;i<s.pts.length;i++)out.push([s.pts[i-1],s.pts[i]]);return out}function collide(b,a,z,px,py){const dx=z.x-a.x,dy=z.y-a.y,t=clamp(((b.x-a.x)*dx+(b.y-a.y)*dy)/(dx*dx+dy*dy||1),0,1),qx=a.x+dx*t,qy=a.y+dy*t,vx=b.x-qx,vy=b.y-qy,dist=Math.hypot(vx,vy),limit=b.r+LINE/2;if(dist>=limit)return;let nx,ny;if(dist>0.0001){nx=vx/dist;ny=vy/dist}else{nx=0;ny=py<=a.y?-1:1}b.x+=nx*(limit-dist+.03);b.y+=ny*(limit-dist+.03);const dot=b.vx*nx+b.vy*ny;if(dot<0){b.vx-=dot*nx*1.25;b.vy-=dot*ny*1.25;b.vx*=.985;b.vy*=.985}}function keepRolling(b,g){for(let i=0;i<N;i++){const y=floorY(i);if(Math.abs(b.y+b.r-y)>3.5)continue;const gap=initialGap(i),baseHole=b.x+b.r>gap[0]&&b.x-b.r<gap[1],erased=floorCuts[i].some(([a,z])=>b.x+b.r>a&&b.x-b.r<z);if(!baseHole&&!erased){const dir=i%2===0?1:-1;b.vx=dir*Math.max(38,Math.min(100,Math.abs(b.vx)));b.vy=Math.min(0,b.vy);return}}}function step(dt,ss){const g=bounds(),dw=doorSize();for(const b of balls){b.lock=Math.max(0,b.lock-dt);const n=Math.max(1,Math.ceil(Math.max(Math.abs(b.vx*dt),Math.abs(b.vy*dt))/Math.max(1,b.r*.2)));for(let k=0;k<n;k++){const oldX=b.x,oldY=b.y,dd=dt/n;b.vy+=gravity*dd;b.x+=b.vx*dd;b.y+=b.vy*dd;if(b.x-b.r<g.left){b.x=g.left+b.r;b.vx=Math.abs(b.vx)*.65}if(b.x+b.r>g.right){b.x=g.right-b.r;b.vx=-Math.abs(b.vx)*.65}if(b.y-b.r<g.top){b.y=g.top+b.r;b.vy=Math.abs(b.vy)*.6}if(b.y+b.r>g.bottom){b.x=g.left+40+Math.random()*70;b.y=g.top+b.r;b.vx=(Math.random()-.5)*75;b.vy=0;b.lock=.3}if(doors.in&&doors.out&&b.lock===0&&Math.abs(b.x-doors.in.x)<dw.w/2&&Math.abs(b.y-doors.in.y)<dw.h/2){b.x=clamp(doors.out.x,g.left+b.r,g.right-b.r);b.y=clamp(doors.out.y+dw.h/2+b.r+2,g.top+b.r,g.bottom-b.r);b.vx*=.45;b.vy=Math.max(55,Math.abs(b.vy));b.lock=.8;continue}for(const [a,z] of ss)collide(b,a,z,oldX,oldY);keepRolling(b,g);b.x=clamp(b.x,g.left+b.r,g.right-b.r)}}}function draw(){const g=bounds(),ss=segments();ctx.clearRect(0,0,W,H);ctx.strokeStyle='#6f6272';ctx.lineWidth=LINE;ctx.lineCap='butt';ctx.beginPath();ctx.moveTo(g.left,g.top);ctx.lineTo(g.left,g.bottom);ctx.moveTo(g.right,g.top);ctx.lineTo(g.right,g.bottom);ctx.moveTo(g.left,g.top);ctx.lineTo(g.right,g.top);ctx.stroke();ctx.strokeStyle='#796b80';ctx.lineWidth=LINE;ctx.lineCap='butt';ctx.beginPath();for(const [a,z] of ss){ctx.moveTo(a.x,a.y);ctx.lineTo(z.x,z.y)}ctx.stroke();for(const kind of ['in','out']){const d=doors[kind];if(!d)continue;const z=doorSize();ctx.fillStyle=kind==='in'?'#b7d9f3':'#f6c4d9';ctx.strokeStyle=kind==='in'?'#37688d':'#a84d7e';ctx.lineWidth=3;ctx.fillRect(d.x-z.w/2,d.y-z.h/2,z.w,z.h);ctx.strokeRect(d.x-z.w/2,d.y-z.h/2,z.w,z.h);ctx.fillStyle='#392f43';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText(kind==='in'?'入口':'出口',d.x,d.y+4)}for(const b of balls){ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffffffaa';ctx.lineWidth=1;ctx.stroke()}}function frame(now){const dt=Math.min(.035,(now-lastTime)/1000||.016);lastTime=now;const ss=segments();if(!paused)for(let i=0;i<4;i++)step(dt/4,ss);draw();requestAnimationFrame(frame)}resetCuts();resize();initBalls();window.addEventListener('resize',resize);requestAnimationFrame(frame)})();
</script></body></html>
