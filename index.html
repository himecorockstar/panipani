zh:{"一時停止":"暂停","リピート：オフ":"循环：关","リピート：オン":"循环：开","再生位置":"播放进度","再生できませんでした":"无法播放此歌曲","アプリの使い方":"应用使用方法","聴く：YouTube動画を選んで再生します。動画名やURLは「YouTube動画を変更」から差し替えられます。「わたし好みの音楽」にはスマホ内の曲を1曲登録できます。":"听：选择 YouTube 视频播放。可在“更改 YouTube 视频”中修改名称或链接。“我喜欢的音乐”可登记手机中的一首歌曲。","観る：1回タップでは何も起きません。2回タップで拡大を元に戻し、左右のスワイプで写真を切り替えます。二本指で拡大できます。観るボタンを2秒長押しすると写真・動画を登録できます。":"看：单击没有操作。双击恢复原始大小，左右滑动切换照片。双指可缩放。长按“看”按钮 2 秒可登记照片。","表紙の「感じる　落ち着く動画」「感じる　書道で落ち着く」から直接開けます。":"可从封面上的两个“感受”按钮直接打开滚球动画或书法。","iPhoneでホーム画面にアイコンを作る":"在 iPhone 主屏幕添加图标","公開ページをSafariで開きます。":"在 Safari 中打开公开页面。","共有ボタン（四角から上向き矢印）を押します。":"点击分享按钮（方框向上箭头）。","メニューから「ホーム画面に追加」を選び、「追加」を押します。項目が見つからない場合は、共有メニューの「アクションを編集」を確認してください。":"选择“添加到主屏幕”，再点击“添加”。找不到时，请查看分享菜单中的“编辑操作”。","Androidでホーム画面にアイコンを作る":"在 Android 主屏幕添加图标","公開ページをChromeで開きます。":"在 Chrome 中打开公开页面。","右上の「︙」を押し、「インストールとショートカットを作成」を選びます。":"点击右上角“︙”，选择“安装并创建快捷方式”。","「ショートカットを作成」または「インストール」を選び、「追加」を押します。端末やChromeの版によって表示名が異なる場合があります。":"选择“创建快捷方式”或“安装”，再点击“添加”。不同设备或 Chrome 版本的文字可能不同。","音が出ないとき":"没有声音时","iPhone：公開ページをSafariで開き直して、再生ボタンを押してください。":"iPhone：在 Safari 中重新打开公开页面，然后点击播放。","Android：アプリ内で開いていて音が出ない場合、上部の黒い三つ星（︙）を押し、「オリジナルのブラウザで開く」または「ブラウザで開く」を選び、Chromeなどで開き直してください。表示名やメニュー位置はアプリの版で異なることがあります。":"Android：若在其他应用内没有声音，点击右上角三点菜单（︙），选择“用原始浏览器打开”或“用浏览器打开”，再用 Chrome 打开。菜单名称和位置可能不同。","ふわっちからの戻り方":"从 Fuwatch 返回","ふわっちが新しいタブで開いた場合は、ブラウザのタブ一覧から「パニックパニック」を選びます。同じタブで開いた場合は、ブラウザの「戻る」矢印を押します。":"Fuwatch 会在同一标签页打开。看完后，点浏览器的“返回”箭头回到应用。","YouTubeからの戻り方":"从 YouTube 返回","ブラウザ内の動画画面は、画面内の「戻る」を押します。YouTubeアプリや別ページに移った場合は、ブラウザの「戻る」矢印か、端末のアプリ切替画面から元のブラウザに戻ります。":"视频在应用内播放。点屏幕上的“返回”回到应用。如果选择“在 YouTube 中打开”，请用浏览器返回箭头或设备的应用切换器返回。","ご注意：":"注意：","これは玩具です。医療機器ではなく、診断・治療・診察を行いません。動作、保存、通信、音声再生、表示内容、気分への効果などについて一切保証しません。登録した写真と曲はこの端末のブラウザ内に保存されます。YouTube動画の再生にはインターネット通信が必要です。別の端末やブラウザには登録内容が自動で移りません。":"本应用是玩具，不是医疗器械，不提供诊断、治疗或诊察。对运行、保存、通信、音频、显示内容及情绪效果等均不作保证。照片和音乐保存在本设备的浏览器中。播放 YouTube 需要网络。内容不会自动转移到其他设备或浏览器。","研究資料・出典を読む":"阅读研究资料与来源",'コース変更':'更改路线','変更終了':'完成','設定':'设置','書道の設定':'书法设置','色替え':'更换颜色','砂色':'沙色','白地・ ko:{"一時停止":"일시정지","リピート：オフ":"반복: 끔","リピート：オン":"반복: 켬","再生位置":"재생 위치","再生できませんでした":"이 곡을 재생할 수 없습니다","アプリの使い方":"앱 사용 방법","聴く：YouTube動画を選んで再生します。動画名やURLは「YouTube動画を変更」から差し替えられます。「わたし好みの音楽」にはスマホ内の曲を1曲登録できます。":"듣기: YouTube 동영상을 선택해 재생합니다. “YouTube 동영상 변경”에서 제목과 링크를 바꿀 수 있습니다. “내가 좋아하는 음악”에는 휴대전화의 곡 한 개를 등록할 수 있습니다.","観る：1回タップでは何も起きません。2回タップで拡大を元に戻し、左右のスワイプで写真を切り替えます。二本指で拡大できます。観るボタンを2秒長押しすると写真・動画を登録できます。":"보기: 한 번 탭하면 아무 일도 일어나지 않습니다. 두 번 탭하면 원래 크기로 돌아가고, 좌우로 밀어 사진을 바꿉니다. 두 손가락으로 확대할 수 있습니다. “보기”를 2초 길게 누르면 사진을 등록합니다.","表紙の「感じる　落ち着く動画」「感じる　書道で落ち着く」から直接開けます。":"표지의 두 “느끼기” 버튼에서 공 애니메이션과 서예를 바로 열 수 있습니다.","iPhoneでホーム画面にアイコンを作る":"iPhone 홈 화면에 아이콘 추가","公開ページをSafariで開きます。":"Safari에서 공개 페이지를 엽니다.","共有ボタン（四角から上向き矢印）を押します。":"공유 버튼(위쪽 화살표가 있는 사각형)을 누릅니다.","メニューから「ホーム画面に追加」を選び、「追加」を押します。項目が見つからない場合は、共有メニューの「アクションを編集」を確認してください。":"“홈 화면에 추가”를 선택한 뒤 “추가”를 누릅니다. 항목이 없으면 공유 메뉴의 “동작 편집”을 확인하세요.","Androidでホーム画面にアイコンを作る":"Android 홈 화면에 아이콘 추가","公開ページをChromeで開きます。":"Chrome에서 공개 페이지를 엽니다.","右上の「︙」を押し、「インストールとショートカットを作成」を選びます。":"오른쪽 위 “︙”를 누르고 “설치 및 바로가기 만들기”를 선택합니다.","「ショートカットを作成」または「インストール」を選び、「追加」を押します。端末やChromeの版によって表示名が異なる場合があります。":"“바로가기 만들기” 또는 “설치”를 선택하고 “추가”를 누릅니다. 기기와 Chrome 버전에 따라 문구가 다를 수 있습니다.","音が出ないとき":"소리가 나지 않을 때","iPhone：公開ページをSafariで開き直して、再生ボタンを押してください。":"iPhone: Safari에서 공개 페이지를 다시 열고 재생 버튼을 누르세요.","Android：アプリ内で開いていて音が出ない場合、上部の黒い三つ星（︙）を押し、「オリジナルのブラウザで開く」または「ブラウザで開く」を選び、Chromeなどで開き直してください。表示名やメニュー位置はアプリの版で異なることがあります。":"Android: 다른 앱 안에서 소리가 나지 않으면 오른쪽 위 점 세 개(︙)를 누르고 “기본 브라우저에서 열기” 또는 “브라우저에서 열기”를 선택해 Chrome에서 다시 여세요. 메뉴 문구와 위치는 다를 수 있습니다.","ふわっちからの戻り方":"Fuwatch에서 돌아오기","ふわっちが新しいタブで開いた場合は、ブラウザのタブ一覧から「パニックパニック」を選びます。同じタブで開いた場合は、ブラウザの「戻る」矢印を押します。":"Fuwatch는 같은 탭에서 열립니다. 다 본 뒤 브라우저의 뒤로 가기 화살표를 눌러 앱으로 돌아오세요.","YouTubeからの戻り方":"YouTube에서 돌아오기","ブラウザ内の動画画面は、画面内の「戻る」を押します。YouTubeアプリや別ページに移った場合は、ブラウザの「戻る」矢印か、端末のアプリ切替画面から元のブラウザに戻ります。":"동영상은 앱 안에서 재생됩니다. 화면의 “뒤로” 버튼을 누르면 앱으로 돌아옵니다. “YouTube에서 열기”를 선택했다면 브라우저 뒤로 가기 또는 앱 전환 화면을 이용하세요.","ご注意：":"주의:","これは玩具です。医療機器ではなく、診断・治療・診察を行いません。動作、保存、通信、音声再生、表示内容、気分への効果などについて一切保証しません。登録した写真と曲はこの端末のブラウザ内に保存されます。YouTube動画の再生にはインターネット通信が必要です。別の端末やブラウザには登録内容が自動で移りません。":"이 앱은 장난감이며 의료기기가 아닙니다. 진단·치료·진료를 하지 않습니다. 작동, 저장, 통신, 오디오, 화면 내용, 기분에 대한 효과를 보장하지 않습니다. 사진과 음악은 이 기기의 브라우저에 저장됩니다. YouTube 재생에는 인터넷이 필요하며 다른 기기나 브라우저로 자동 이동되지 않습니다.","研究資料・出典を読む":"연구 자료와 출처 읽기",'コース変更':'코스 변경','変更終了':'변경 완료','設定':'설정','書道の設定':'서예 설정','色替え':'색상 변경','砂色':'모래색','白地・黒墨':'흰 바탕·검은 먹','消去':'지우기','お手本表示：':'본보기:','（押すと変更）':'(눌러서 수정)','お手本の文字':'본보기 글자','お手本の文字を入力':'본보기 글자 입력','お手本記入':'본보기 쓰기','開始':'시작','（医療機器用品ではありません）':'(의료기기가 아닙니다)','読んでね':'사용 안내','言語':'언어','聴く':'듣기','観る':'보기','感じる':'느끼기','落ち着く動画':'편안한 영상','書道で落ち着く':'서예로 마음 가라앉히기','YouTubeの音・好きな曲を再生':'YouTube 또는 좋아하는 음악 재생','写真を表示・スワイプで選択':'사진 보기 및 스와이프로 선택','パニック障害を乗り越えました':'공황장애를 극복했어요','YouTube動画を開く':'YouTube 동영상 열기','ふわっち':'후왓치','ふわっちを開く':'후왓치 열기','これは玩具です。':'이것은 장난감입니다.','診断・治療・診察を行うものではありません。':'진단, 치료, 진료를 제공하지 않습니다.','戻る':'뒤로','閉じる':'닫기','写真・動画を登録':'사진 등록','写真を追加':'사진 추가','写真・動画を登録・編集':'사진 등록·편집','この画面を消す':'이 화면 지우기','YouTube動画を変更':'YouTube 동영상 변경','わたし好みの音楽':'내가 좋아하는 음악','別の曲を登録':'다른 곡 등록','保存する':'저장','貼り付け':'붙여넣기','研究資料・出典を読む':'연구 자료 및 출처 보기','研究資料':'연구 자료','音が出ないとき':'소리가 나지 않을 때','言語を選ぶ':'언어 선택','アプリの使い方':'앱 사용 방법','YouTubeで再生':'YouTube에서 재생'},
fr:{"一時停止":"Pause","リピート：オフ":"Répétition : non","リピート：オン":"Répétition : oui","再生位置":"Position de lecture","再生できませんでした":"Lecture impossible","アプリの使い方":"Mode d’emploi","聴く：YouTube動画を選んで再生します。動画名やURLは「YouTube動画を変更」から差し替えられます。「わたし好みの音楽」にはスマホ内の曲を1曲登録できます。":"Écouter : choisissez une vidéo YouTube. Modifiez son nom ou son lien avec « Modifier les vidéos YouTube ». Vous pouvez enregistrer un morceau du téléphone dans « Ma musique ».","観る：1回タップでは何も起きません。2回タップで拡大を元に戻し、左右のスワイプで写真を切り替えます。二本指で拡大できます。観るボタンを2秒長押しすると写真・動画を登録できます。":"Voir : un appui simple ne fait rien. Touchez deux fois pour rétablir la taille, balayez à gauche ou à droite pour changer de photo, et pincez pour zoomer. Maintenez « Voir » 2 secondes pour ajouter des photos.","表紙の「感じる　落ち着く動画」「感じる　書道で落ち着く」から直接開けます。":"Ouvrez directement l’animation des balles ou la calligraphie avec les deux boutons « Ressentir » de l’écran d’accueil.","iPhoneでホーム画面にアイコンを作る":"Ajouter une icône à l’écran d’accueil de l’iPhone","公開ページをSafariで開きます。":"Ouvrez la page publique dans Safari.","共有ボタン（四角から上向き矢印）を押します。":"Touchez Partager (le carré avec une flèche vers le haut).","メニューから「ホーム画面に追加」を選び、「追加」を押します。項目が見つからない場合は、共有メニューの「アクションを編集」を確認してください。":"Choisissez « Sur l’écran d’accueil », puis « Ajouter ». Si l’option manque, vérifiez « Modifier les actions » dans le menu de partage.","Androidでホーム画面にアイコンを作る":"Ajouter une icône à l’écran d’accueil Android","公開ページをChromeで開きます。":"Ouvrez la page publique dans Chrome.","右上の「︙」を押し、「インストールとショートカットを作成」を選びます。":"Touchez « ︙ » en haut à droite et choisissez « Installer et créer un raccourci ».","「ショートカットを作成」または「インストール」を選び、「追加」を押します。端末やChromeの版によって表示名が異なる場合があります。":"Choisissez « Créer un raccourci » ou « Installer », puis « Ajouter ». Le libellé peut varier selon l’appareil et Chrome.","音が出ないとき":"En l’absence de son","iPhone：公開ページをSafariで開き直して、再生ボタンを押してください。":"iPhone : rouvrez la page publique dans Safari et touchez Lecture.","Android：アプリ内で開いていて音が出ない場合、上部の黒い三つ星（︙）を押し、「オリジナルのブラウザで開く」または「ブラウザで開く」を選び、Chromeなどで開き直してください。表示名やメニュー位置はアプリの版で異なることがあります。":"Android : si le son ne fonctionne pas dans une autre application, touchez le menu à trois points (︙), choisissez « Ouvrir dans le navigateur » et rouvrez la page dans Chrome. Le menu peut varier.","ふわっちからの戻り方":"Revenir de Fuwatch","ふわっちが新しいタブで開いた場合は、ブラウザのタブ一覧から「パニックパニック」を選びます。同じタブで開いた場合は、ブラウザの「戻る」矢印を押します。":"Fuwatch s’ouvre dans le même onglet. Après visionnage, utilisez la flèche Retour du navigateur pour revenir à l’application.","YouTubeからの戻り方":"Revenir de YouTube","ブラウザ内の動画画面は、画面内の「戻る」を押します。YouTubeアプリや別ページに移った場合は、ブラウザの「戻る」矢印か、端末のアプリ切替画面から元のブラウザに戻ります。":"Les vidéos sont lues dans l’application. Touchez Retour à l’écran pour y revenir. Si vous choisissez « Ouvrir dans YouTube », utilisez la flèche Retour du navigateur ou le sélecteur d’applications.","ご注意：":"Remarque :","これは玩具です。医療機器ではなく、診断・治療・診察を行いません。動作、保存、通信、音声再生、表示内容、気分への効果などについて一切保証しません。登録した写真と曲はこの端末のブラウザ内に保存されます。YouTube動画の再生にはインターネット通信が必要です。別の端末やブラウザには登録内容が自動で移りません。":"Ceci est un jouet, pas un dispositif médical. Il ne fournit ni diagnostic, ni traitement, ni consultation. Aucun fonctionnement, enregistrement, son ou effet sur l’humeur n’est garanti. Les photos et morceaux restent dans le navigateur de cet appareil. YouTube nécessite Internet et les données ne sont pas transférées automatiquement.","研究資料・出典を読む":"Lire les recherches et les sources",'コース変更':'Modifier le parcours','変更終了':'Terminer','設定':'Réglages','書道の設定':'Réglages de calligraphie','色替え':'Changer les couleurs','砂色':'Couleur sable','白地・黒墨':'Fond blanc, encre noire','消去':'Effacer','お手本表示：':'Modèle :','（押すと変更）':'(Appuyer pour modifier)','お手本の文字':'Texte modèle','お手本の文字を入力':'Saisir le texte modèle','お手本記入':'Insérer le modèle','開始':'Commencer','（医療機器用品ではありません）':'(Ceci n’est pas un dispositif médical)','読んでね':'Mode d’emploi','言語':'Langue','聴く':'Écouter','観る':'Regarder','感じる':'Ressentir','落ち着く動画':'Vidéo apaisante','書道で落ち着く':'Se détendre avec la calligraphie','YouTubeの音・好きな曲を再生':'Écouter YouTube ou votre musique','写真を表示・スワイプで選択':'Voir et faire défiler les photos','パニック障害を乗り越えました':'J’ai surmonté le trouble panique','YouTube動画を開く':'Ouvrir la vidéo YouTube','ふわっち':'Fuwatch','ふわっちを開く':'Ouvrir Fuwatch','これは玩具です。':'Ceci est un jouet.','診断・治療・診察を行うものではありません。':'Il ne fournit ni diagnostic ni traitement médical.','戻る':'Retour','閉じる':'Fermer','写真・動画を登録':'Ajouter des photos','写真を追加':'Ajouter des photos','写真・動画を登録・編集':'Ajouter ou modifier des photos','この画面を消す':'Effacer cet écran','YouTube動画を変更':'Modifier les vidéos YouTube','わたし好みの音楽':'Ma musique','別の曲を登録':'Ajouter une autre chanson','保存する':'Enregistrer','貼り付け':'Coller','研究資料・出典を読む':'Lire les recherches et les sources','研究資料':'Informations de recherche','音が出ないとき':'En cas d’absence de son','言語を選ぶ':'Choisir une langue','アプリの使い方':'Mode d’emploi de l’application','YouTubeで再生':'Lire sur YouTube'},
de:{"一時停止":"Pause","リピート：オフ":"Wiederholen: aus","リピート：オン":"Wiederholen: ein","再生位置":"Wiedergabeposition","再生できませんでした":"Titel konnte nicht abgespielt werden","アプリの使い方":"App verwenden","聴く：YouTube動画を選んで再生します。動画名やURLは「YouTube動画を変更」から差し替えられます。「わたし好みの音楽」にはスマホ内の曲を1曲登録できます。":"Hören: Wählen Sie ein YouTube-Video aus. Titel und Link lassen sich über „YouTube-Videos ändern“ bearbeiten. Unter „Meine Musik“ können Sie einen Titel vom Smartphone speichern.","観る：1回タップでは何も起きません。2回タップで拡大を元に戻し、左右のスワイプで写真を切り替えます。二本指で拡大できます。観るボタンを2秒長押しすると写真・動画を登録できます。":"Ansehen: Ein Tippen bewirkt nichts. Doppeltippen setzt die Vergrößerung zurück, Wischen wechselt das Foto, und mit zwei Fingern können Sie zoomen. Halten Sie „Ansehen“ 2 Sekunden gedrückt, um Fotos hinzuzufügen.","表紙の「感じる　落ち着く動画」「感じる　書道で落ち着く」から直接開けます。":"Öffnen Sie die Ballanimation oder Kalligrafie direkt über die beiden „Fühlen“-Schaltflächen auf dem Titelbild.","iPhoneでホーム画面にアイコンを作る":"Symbol zum iPhone-Home-Bildschirm hinzufügen","公開ページをSafariで開きます。":"Öffnen Sie die öffentliche Seite in Safari.","共有ボタン（四角から上向き矢印）を押します。":"Tippen Sie auf „Teilen“ (Quadrat mit Pfeil nach oben).","メニューから「ホーム画面に追加」を選び、「追加」を押します。項目が見つからない場合は、共有メニューの「アクションを編集」を確認してください。":"Wählen Sie „Zum Home-Bildschirm“ und dann „Hinzufügen“. Falls die Option fehlt, prüfen Sie „Aktionen bearbeiten“ im Teilen-Menü.","Androidでホーム画面にアイコンを作る":"Symbol zum Android-Startbildschirm hinzufügen","公開ページをChromeで開きます。":"Öffnen Sie die öffentliche Seite in Chrome.","右上の「︙」を押し、「インストールとショートカットを作成」を選びます。":"Tippen Sie rechts oben auf „︙“ und wählen Sie „Installieren und Verknüpfung erstellen“.","「ショートカットを作成」または「インストール」を選び、「追加」を押します。端末やChromeの版によって表示名が異なる場合があります。":"Wählen Sie „Verknüpfung erstellen“ oder „Installieren“ und tippen Sie auf „Hinzufügen“. Die Bezeichnung kann je nach Gerät und Chrome-Version abweichen.","音が出ないとき":"Wenn kein Ton zu hören ist","iPhone：公開ページをSafariで開き直して、再生ボタンを押してください。":"iPhone: Öffnen Sie die Seite erneut in Safari und tippen Sie auf Wiedergabe.","Android：アプリ内で開いていて音が出ない場合、上部の黒い三つ星（︙）を押し、「オリジナルのブラウザで開く」または「ブラウザで開く」を選び、Chromeなどで開き直してください。表示名やメニュー位置はアプリの版で異なることがあります。":"Android: Wenn in einer anderen App kein Ton zu hören ist, öffnen Sie das Drei-Punkte-Menü (︙), wählen Sie „Im Browser öffnen“ und laden Sie die Seite in Chrome. Menübezeichnungen können abweichen.","ふわっちからの戻り方":"Von Fuwatch zurückkehren","ふわっちが新しいタブで開いた場合は、ブラウザのタブ一覧から「パニックパニック」を選びます。同じタブで開いた場合は、ブラウザの「戻る」矢印を押します。":"Fuwatch wird im selben Tab geöffnet. Kehren Sie nach dem Ansehen mit dem Zurück-Pfeil des Browsers zur App zurück.","YouTubeからの戻り方":"Von YouTube zurückkehren","ブラウザ内の動画画面は、画面内の「戻る」を押します。YouTubeアプリや別ページに移った場合は、ブラウザの「戻る」矢印か、端末のアプリ切替画面から元のブラウザに戻ります。":"Videos werden in der App abgespielt. Tippen Sie auf Zurück, um zur App zu gelangen. Bei „In YouTube öffnen“ verwenden Sie den Zurück-Pfeil des Browsers oder die App-Übersicht.","ご注意：":"Hinweis:","これは玩具です。医療機器ではなく、診断・治療・診察を行いません。動作、保存、通信、音声再生、表示内容、気分への効果などについて一切保証しません。登録した写真と曲はこの端末のブラウザ内に保存されます。YouTube動画の再生にはインターネット通信が必要です。別の端末やブラウザには登録内容が自動で移りません。":"Dies ist ein Spielzeug, kein Medizinprodukt. Es bietet keine Diagnose, Behandlung oder ärztliche Beratung. Für Betrieb, Speicherung, Verbindung, Ton, Inhalte oder Auswirkungen auf die Stimmung wird nichts garantiert. Fotos und Musik bleiben im Browser dieses Geräts. YouTube benötigt Internet; Daten werden nicht automatisch übertragen.","研究資料・出典を読む":"Forschung und Quellen lesen",'コース変更':'Bahn ändern','変更終了':'Fertig','設定':'Einstellungen','書道の設定':'Kalligrafie-Einstellungen','色替え':'Farben ändern','砂色':'Sandfarbe','白地・黒墨':'Weißer Grund, schwarze Tusche','消去':'Löschen','お手本表示：':'Vorlage:','（押すと変更）':'(Zum Ändern tippen)','お手本の文字':'Vorlagentext','お手本の文字を入力':'Vorlagentext eingeben','お手本記入':'Vorlage eintragen','開始':'Start','（医療機器用品ではありません）':'(Kein Medizinprodukt)','読んでね':'Anleitung','言語':'Sprache','聴く':'Hören','観る':'Ansehen','感じる':'Spüren','落ち着く動画':'Beruhigendes Video','書道で落ち着く':'Mit Kalligrafie entspannen','YouTubeの音・好きな曲を再生':'YouTube oder eigene Musik abspielen','写真を表示・ス vi:{"一時停止":"Tạm dừng","リピート：オフ":"Lặp lại: Tắt","リピート：オン":"Lặp lại: Bật","再生位置":"Vị trí phát","再生できませんでした":"Không thể phát bài này","アプリの使い方":"Cách sử dụng ứng dụng","聴く：YouTube動画を選んで再生します。動画名やURLは「YouTube動画を変更」から差し替えられます。「わたし好みの音楽」にはスマホ内の曲を1曲登録できます。":"Nghe: Chọn video YouTube để phát. Đổi tên hoặc liên kết trong “Đổi video YouTube”. Bạn có thể lưu một bài nhạc trong điện thoại ở “Nhạc tôi thích”.","観る：1回タップでは何も起きません。2回タップで拡大を元に戻し、左右のスワイプで写真を切り替えます。二本指で拡大できます。観るボタンを2秒長押しすると写真・動画を登録できます。":"Xem: Chạm một lần không làm gì. Chạm hai lần để trở về cỡ ban đầu; vuốt trái/phải để đổi ảnh; dùng hai ngón tay để phóng to. Nhấn giữ nút Xem 2 giây để thêm ảnh.","表紙の「感じる　落ち着く動画」「感じる　書道で落ち着く」から直接開けます。":"Mở hoạt ảnh bóng hoặc thư pháp bằng hai nút Cảm nhận trên trang bìa.","iPhoneでホーム画面にアイコンを作る":"Thêm biểu tượng vào Màn hình chính iPhone","公開ページをSafariで開きます。":"Mở trang công khai bằng Safari.","共有ボタン（四角から上向き矢印）を押します。":"Chạm nút Chia sẻ (hình vuông có mũi tên lên).","メニューから「ホーム画面に追加」を選び、「追加」を押します。項目が見つからない場合は、共有メニューの「アクションを編集」を確認してください。":"Chọn “Thêm vào Màn hình chính”, rồi chạm “Thêm”. Nếu không thấy, hãy kiểm tra “Sửa tác vụ” trong menu Chia sẻ.","Androidでホーム画面にアイコンを作る":"Thêm biểu tượng vào Màn hình chính Android","公開ページをChromeで開きます。":"Mở trang công khai bằng Chrome.","右上の「︙」を押し、「インストールとショートカットを作成」を選びます。":"Chạm “︙” ở góc trên bên phải và chọn “Cài đặt và tạo lối tắt”.","「ショートカットを作成」または「インストール」を選び、「追加」を押します。端末やChromeの版によって表示名が異なる場合があります。":"Chọn “Tạo lối tắt” hoặc “Cài đặt”, rồi chạm “Thêm”. Tên mục có thể khác theo thiết bị và phiên bản Chrome.","音が出ないとき":"Khi không có âm thanh","iPhone：公開ページをSafariで開き直して、再生ボタンを押してください。":"iPhone: Mở lại trang công khai bằng Safari và chạm Phát.","Android：アプリ内で開いていて音が出ない場合、上部の黒い三つ星（︙）を押し、「オリジナルのブラウザで開く」または「ブラウザで開く」を選び、Chromeなどで開き直してください。表示名やメニュー位置はアプリの版で異なることがあります。":"Android: Nếu không có tiếng trong ứng dụng khác, chạm menu ba chấm (︙), chọn “Mở bằng trình duyệt” rồi mở lại bằng Chrome. Tên và vị trí menu có thể khác.","ふわっちからの戻り方":"Cách quay lại từ Fuwatch","ふわっちが新しいタブで開いた場合は、ブラウザのタブ一覧から「パニックパニック」を選びます。同じタブで開いた場合は、ブラウザの「戻る」矢印を押します。":"Fuwatch mở trong cùng một thẻ. Xem xong, nhấn mũi tên Quay lại của trình duyệt để trở về ứng dụng.","YouTubeからの戻り方":"Cách quay lại từ YouTube","ブラウザ内の動画画面は、画面内の「戻る」を押します。YouTubeアプリや別ページに移った場合は、ブラウザの「戻る」矢印か、端末のアプリ切替画面から元のブラウザに戻ります。":"Video phát trong ứng dụng. Nhấn nút Quay lại trên màn hình để trở về. Nếu chọn “Mở trong YouTube”, hãy dùng mũi tên Quay lại hoặc trình chuyển ứng dụng.","ご注意：":"Lưu ý:","これは玩具です。医療機器ではなく、診断・治療・診察を行いません。動作、保存、通信、音声再生、表示内容、気分への効果などについて一切保証しません。登録した写真と曲はこの端末のブラウザ内に保存されます。YouTube動画の再生にはインターネット通信が必要です。別の端末やブラウザには登録内容が自動で移りません。":"Đây là đồ chơi, không phải thiết bị y tế và không chẩn đoán, điều trị hay khám bệnh. Không bảo đảm hoạt động, lưu trữ, kết nối, âm thanh, nội dung hoặc tác động tâm trạng. Ảnh và nhạc được lưu trong trình duyệt trên thiết bị này. YouTube cần Internet; dữ liệu không tự chuyển sang thiết bị khác.","研究資料・出典を読む":"Đọc nghiên cứu và nguồn",'コース変更':'Đổi đường đi','変更終了':'Xong','設定':'Cài đặt','書道の設定':'Cài đặt thư pháp','色替え':'Đổi màu','砂色':'Màu cát','白地・黒墨':'Nền trắng, mực đen','消去':'Xóa','お手本表示：':'Mẫu:','（押すと変更）':'(Chạm để sửa)','お手本の文字':'Chữ mẫu','お手本の文字を入力':'Nhập chữ mẫu','お手本記入':'Viết chữ mẫu','開始':'Bắt đầu','（医療機器用品ではありません）':'(Không phải thiết bị y tế)','読んでね':'Hướng dẫn','言語':'Ngôn ngữ','聴く':'Nghe','観る':'Xem','感じる':'Cảm nhận','落ち着く動画':'Video thư giãn','書道で落ち着く':'Thư giãn bằng thư pháp','YouTubeの音・好きな曲を再生':'Phát YouTube hoặc nhạc yêu thích','写真を表示・スワイプで選択':'Xem và vuốt để chọn ảnh','パニック障害を乗り越えました':'Tôi đã vượt qua chứng hoảng sợ','YouTube動画を開く':'Mở video YouTube','ふわっち':'Fuwatch','ふわっちを開く':'Mở Fuwatch','これは玩具です。':'Đây là đồ chơi.','診断・治療・診察を行うものではありません。':'Ứng dụng không chẩn đoán hay điều trị.','戻る':'Quay lại','閉じる':'Đóng','写真・動画を登録':'Thêm ảnh','写真を追加':'Thêm ảnh','写真・動画を登録・編集':'Thêm hoặc sửa ảnh','この画面を消す':'Xóa màn hình này','YouTube動画を変更':'Đổi video YouTube','わたし好みの音楽':'Nhạc tôi thích','別の曲を登録':'Thêm bài khác','保存する':'Lưu','貼り付け':'D hi:{"一時停止":"रोकें","リピート：オフ":"दोहराएँ: बंद","リピート：オン":"दोहराएँ: चालू","再生位置":"प्लेबैक स्थिति","再生できませんでした":"यह गीत नहीं चल सका","アプリの使い方":"ऐप का उपयोग कैसे करें","聴く：YouTube動画を選んで再生します。動画名やURLは「YouTube動画を変更」から差し替えられます。「わたし好みの音楽」にはスマホ内の曲を1曲登録できます。":"सुनें: चलाने के लिए YouTube वीडियो चुनें। “YouTube वीडियो बदलें” से नाम या लिंक बदलें। “मेरी पसंद का संगीत” में फ़ोन का एक गीत जोड़ सकते हैं।","観る：1回タップでは何も起きません。2回タップで拡大を元に戻し、左右のスワイプで写真を切り替えます。二本指で拡大できます。観るボタンを2秒長押しすると写真・動画を登録できます。":"देखें: एक बार टैप करने पर कुछ नहीं होगा। दो बार टैप करके आकार सामान्य करें; बाएँ/दाएँ स्वाइप से फ़ोटो बदलें; दो उँगलियों से ज़ूम करें। फ़ोटो जोड़ने के लिए देखें बटन 2 सेकंड दबाएँ।","表紙の「感じる　落ち着く動画」「感じる　書道で落ち着く」から直接開けます。":"मुखपृष्ठ के दो “महसूस करें” बटनों से गेंदों का ऐनिमेशन या सुलेख खोलें।","iPhoneでホーム画面にアイコンを作る":"iPhone होम स्क्रीन पर आइकन जोड़ें","公開ページをSafariで開きます。":"सार्वजनिक पेज Safari में खोलें।","共有ボタン（四角から上向き矢印）を押します。":"शेयर बटन (ऊपर तीर वाला चौकोर) दबाएँ।","メニューから「ホーム画面に追加」を選び、「追加」を押します。項目が見つからない場合は、共有メニューの「アクションを編集」を確認してください。":"“होम स्क्रीन में जोड़ें” चुनें, फिर “जोड़ें” दबाएँ। विकल्प न मिले तो शेयर मेन्यू में “ऐक्शन संपादित करें” देखें।","Androidでホーム画面にアイコンを作る":"Android होम स्क्रीन पर आइकन जोड़ें","公開ページをChromeで開きます。":"सार्वजनिक पेज Chrome में खोलें।","右上の「︙」を押し、「インストールとショートカットを作成」を選びます。":"ऊपर दाईं ओर “︙” दबाकर “इंस्टॉल और शॉर्टकट बनाएँ” चुनें।","「ショートカットを作成」または「インストール」を選び、「追加」を押します。端末やChromeの版によって表示名が異なる場合があります。":"“शॉर्टकट बनाएँ” या “इंस्टॉल” चुनें और “जोड़ें” दबाएँ। नाम डिवाइस और Chrome संस्करण के अनुसार बदल सकता है।","音が出ないとき":"आवाज़ न आए तो","iPhone：公開ページをSafariで開き直して、再生ボタンを押してください。":"iPhone: सार्वजनिक पेज Safari में फिर खोलें और चलाएँ दबाएँ।","Android：アプリ内で開いていて音が出ない場合、上部の黒い三つ星（︙）を押し、「オリジナルのブラウザで開く」または「ブラウザで開く」を選び、Chromeなどで開き直してください。表示名やメニュー位置はアプリの版で異なることがあります。":"Android: दूसरे ऐप में आवाज़ न आए तो ऊपर दाईं ओर तीन-बिंदु मेन्यू (︙) दबाएँ, “ब्राउज़र में खोलें” चुनें और Chrome में फिर खोलें। मेन्यू के नाम और स्थान अलग हो सकते हैं।","ふわっちからの戻り方":"Fuwatch से वापस कैसे आएँ","ふわっちが新しいタブで開いた場合は、ブラウザのタブ一覧から「パニックパニック」を選びます。同じタブで開いた場合は、ブラウザの「戻る」矢印を押します。":"Fuwatch उसी टैब में खुलेगा। देखने के बाद ऐप पर लौटने के लिए ब्राउज़र का पीछे वाला तीर दबाएँ।","YouTubeからの戻り方":"YouTube से वापस कैसे आएँ","ブラウザ内の動画画面は、画面内の「戻る」を押します。YouTubeアプリや別ページに移った場合は、ブラウザの「戻る」矢印か、端末のアプリ切替画面から元のブラウザに戻ります。":"वीडियो ऐप के अंदर चलता है। लौटने के लिए स्क्रीन पर “वापस” दबाएँ। “YouTube में खोलें” चुनने पर ब्राउज़र का पीछे तीर या ऐप स्विचर इस्तेमाल करें।","ご注意：":"ध्यान दें:","これは玩具です。医療機器ではなく、診断・治療・診察を行いません。動作、保存、通信、音声再生、表示内容、気分への効果などについて一切保証しません。登録した写真と曲はこの端末のブラウザ内に保存されます。YouTube動画の再生にはインターネット通信が必要です。別の端末やブラウザには登録内容が自動で移りません。":"यह खिलौना है, चिकित्सा उपकरण नहीं। यह निदान, उपचार या चिकित्सा-जाँच नहीं करता। संचालन, संग्रहण, कनेक्शन, ध्वनि, सामग्री या मनोदशा पर प्रभाव की कोई गारंटी नहीं है। फ़ोटो और संगीत इसी डिवाइस के ब्राउज़र में रहते हैं। YouTube के लिए इंटरनेट चाहिए; डेटा दूसरे डिवाइस में अपने-आप नहीं जाता।","研究資料・出典を読む":"शोध और स्रोत पढ़ें",'コース変更':'मार्ग बदलें','変更終了':'पूरा हुआ','設定':'सेटिंग्स','書道の設定':'सुलेख सेटिंग्स','色替え':'रंग बदलें','砂色':'रेत का रंग','白地・黒墨':'सफेद पृष्ठ, काली स्याही','消去':'मिटाएँ','お手本表示：':'नमूना:','（押すと変更）':'(बदलने के लिए दबाएँ)','お手本の文字':'नमूना पाठ','お手本の文字を入力':'नमूना पाठ दर्ज करें','お手本記入':'नमूना लिखें','開始':'शुरू करें','（医療機器用品ではありません）':'(यह चिकित्सा उपकरण नहीं है)','読んでね':'उपयोग निर्देश','言語':'भाषा','聴く':'सुनें','観る':'देखें','感じる':'महसूस करें','落ち着く動画':'शांत करने वाला वीडियो','書道で落ち着く':'सुलेख से शांति','YouTubeの音・好きな曲を再生':'YouTube या अपना पसंदीदा संगीत चलाएँ','写真を表示・スワイプで選択':'तस्वीरें देखें और स्वाइप करके चुनें','パニック障害を乗り越えました':'मैंने पैनिक डिसऑर्डर पर काबू पाया','YouTube動画を開く':'YouTube वीडियो खोलें','ふわっち':'Fuwatch','ふわっちを開く':'Fuwatch खोलें','これは玩具です。':'यह एक खिलौना है।','診断・治療・診察を行うものではありません。':'यह निदान या उपचार प्रदान नहीं करता।','戻る':'वापस','閉じる':'बंद करें','写真・動画を登録':'तस्वीरें जोड़ें','写真を追加':'तस्वीरें जोड़ें','写真・動画を登録・編集':'तस्वीरें जोड़ें या संपादित करें','この画面を消す':'यह स्क्रीन साफ़ करें','YouTube動画を変更':'YouTube वीडियो बदलें','わたし好みの音楽':'मेरा प function makeVideoPreview(blob){
 return new Promise(resolve=>{
  const video=document.createElement('video'),url=URL.createObjectURL(blob);
  const timeout=setTimeout(()=>finish(null),5000);
  function finish(preview){
   clearTimeout(timeout);
   video.onloadedmetadata=video.onloadeddata=video.onseeked=video.onerror=null;
   video.removeAttribute('src');
   video.load();
   URL.revokeObjectURL(url);
   resolve(preview);
  }
  function capture(){
   if(video.readyState<2||!video.videoWidth)return;
   try{
    const canvas=document.createElement('canvas');
    const scale=Math.min(1,480/Math.max(video.videoWidth,video.videoHeight));
    canvas.width=Math.max(1,Math.round(video.videoWidth*scale));
    canvas.height=Math.max(1,Math.round(video.videoHeight*scale));
    canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
    finish(canvas.toDataURL('image/jpeg',.82));
   }catch{finish(null)}
  }
  video.preload='auto';
  video.muted=true;
  video.playsInline=true;
  video.onloadedmetadata=()=>{
   const target=video.duration<=1?video.duration/2:1;
   if(Number.isFinite(target)&&target>0){
    video.currentTime=target;
    video.onseeked=capture;
   }else video.onloadeddata=capture;
  };
  video.onerror=()=>finish(null);
  video.src=url;
 });
}

function stampVertical(ctx,text,{rows,columns,advance,right,top}){
 const characters=typeof Intl.Segmenter==='function'
  ?new Intl.Segmenter('ja',{granularity:'grapheme'}).segment(text):text;
 let row=0,column=0;
 for(const part of characters){
  const glyph=typeof part==='string'?part:part.segment;
  if(/^[\r\n]+$/.test(glyph)){column++;row=0;continue}
  if(row>=rows){column++;row=0}
  if(column>=columns)break;
  ctx.fillText(glyph,right-column*advance,top+row*advance);
  row++;
 }

const researchEntries=[
{title:'森の音を聴いたときの心拍・自律神経反応',meta:'千葉大学・石川県立看護大学など｜Jo, Song, Ikei, Miyazaki ほか｜2019｜女子大学生29人',body:`<p><span class="research-tag">自然音</span><span class="research-tag">心拍</span><span class="research-tag">60秒の比較実験</span></p><p>女子大学生29人が、ヘッドホンで森の音と都市の音をそれぞれ60秒聴く実験です。森の音では都市音に比べ、心拍数と交感神経活動の指標が低くなり、「快適・リラックス・自然」といった主観評価も改善しました。研究チームには千葉大学のHyunju Jo、Chorong Song、Yoshifumi Miyazakiらが参加しています。</p><p><b>限界：</b>健康な若い女性の短時間・実験室での比較です。音源は高音質の森林録音で、アプリ内の合成音ではありません。パニック発作や症状の持続時間を調べた研究ではありません。</p><p><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6695879/" target="_blank" rel="noopener">論文全文（オープンアクセス）</a></p>`},
{title:'ゆっくりした手首の振動と不安・発汗反応',meta:'Royal Holloway, University of London｜Azevedo ほか｜Scientific Reports, 2017｜52人',body:`<p><span class="research-tag">振動</span><span class="research-tag">皮膚電気反応</span><span class="research-tag">主観的不安</span></p><p>人前でスピーチをする前の不安を調べた実験です。参加者52人を、脈拍より約20％遅い心拍風の振動を手首に受ける群と、振動を受けない群に分けました。振動群では、課題中の皮膚コンダクタンス（発汗に関連する指標）の上昇と自己申告の不安が小さくなりました。一方、心拍数の群間差は確認されませんでした。</p><p><b>このアプリとの関係：</b>スマホのバイブにも「一定の触覚リズム」という共通点はあります。ただし研究の装置は脈拍に合わせた専用リストバンドです。このアプリの振動設定が同じ結果を生むとは確認されていません。実験はパニック発作ではなく、スピーチ前の不安です。</p><p><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5442094/" target="_blank" rel="noopener">論文本文（PubMed Central）</a>　<a href="https://www.royalholloway.ac.uk/about-us/news/wearing-a-heart-on-your-sleeve-can-reduce-stress/" target="_blank" rel="noopener">Royal Hollowayの研究紹介</a></p>`},
{title:'パニック症のHRVバイオフィードバック試験',meta:'マインツ大学医療センター・ドレスデン工科大学病院・ボン大学病院｜Herhaus ほか｜2022｜52人',body:`<p><span class="research-tag">パニック症の参加者</span><span class="research-tag">4週間</span><span class="research-tag">心拍・HRV</span></p><p>パニック症の成人52人（女性36人、男性16人）を対象に、0.1 Hzのゆっくりした呼吸を心拍変動（HRV）バイオフィードバックと組み合わせる4週間の介入を、対照条件と比較しました。介入群ではHRVが増え、ペース呼吸中の心拍数は開始前より平均5.87拍/分低下し、パニック・広場恐怖症尺度も低下しました。</p><p><b>大切な限界：</b>これは4週間・複数回の訓練研究です。発作中にスマホを数分使うだけの効果を示したものではなく、アプリ内の色・音・振動の検証でもありません。数値をこのアプリの効果として表示しません。</p><p><a href="https://pubmed.ncbi.nlm.nih.gov/34654028/" target="_blank" rel="noopener">PubMed掲載論文・抄録</a></p>`},
{title:'歯科手術前の音楽と不安・自律神経指標',meta:'北海道大学大学院歯学研究院｜Miyata ほか｜無作為比較試験｜成人86人',body:`<p><span class="research-tag">本人が聴く音楽</span><span class="research-tag">不安</span><span class="research-tag">心拍変動</span></p><p>親知らずの抜歯を受ける成人86人を対象にした試験です。恐怖が強い患者では、待合中に音楽を聴いた群で、交感神経活動に関連する心拍変動指標の変化と自己申告の不安が小さくなりました。一方、心拍数と副交感神経指標には有意差がありませんでした。著者K. Miyataらは北海道大学の歯学系部門に所属しています。</p><p><b>このアプリとの関係：</b>本人が選べる音楽を用意する考えの参考になります。ただし歯科処置前の不安を調べた研究で、パニック発作やこのアプリの登録曲の効果ではありません。</p><p><a href="https://pubmed.ncbi.nlm.nih.gov/30931796/" target="_blank" rel="noopener">PubMed掲載論文・抄録</a></p>`},
{title:'スマートフォンの短いHRVゲームとストレス回復',meta:'カリフォルニア大学アーバイン校（UCI）｜2019｜140人',body:`<p><span class="research-tag">スマホ介入</span><span class="research-tag">実験ストレス後</span><span class="research-tag">唾液αアミラーゼ</span></p><p>大学生140人が実験室でスピーチ・暗算課題を行った後、5分間、スマホHRVバイオフィードバックゲームを使う群などに分かれました。ゲーム群では、回復中の唾液αアミラーゼが他条件より低い結果でした。</p><p><b>差が出なかった指標：</b>自己申告のストレスとコルチゾールの回復には条件間の有意差がありませんでした。参加者はUCIの若い学生で、健康な若年女性が多く、パニック発作の研究ではありません。また、対象アプリ「Happify」の企業から研究資金提供があり、論文は資金提供を開示しています。</p><p><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6904898/" target="_blank" rel="noopener">論文全文（JMIR Games, PMC）</a></p>`},
{title:'光色と休息・疲労の実験',meta:'東京大学大学院の建築系研究者ら｜Ko, Lee, Chiang, Koga, Hirate｜日本建築学会環境系論文集, 2011',body:`<p><span class="research-tag">東京大学</span><span class="research-tag">LED照明</span><span class="research-tag">疲労評価</span></p><p>白色蛍光灯下で疲労を誘発した後、色付きLED照明などの環境で休息する実験です。疲労感、心拍、フリッカー値、室内印象を評価し、淡い青色LEDなどで休息・疲労低減に関する結果が報告されました。著者には東京大学のByoung woo Ko、Dong gi Lee、Takaaki Koga、Kotaroh Hirateらが含まれます。</p><p><b>このアプリとの関係：</b>実験は部屋全体の照明環境で行われました。スマホ画面の色変化・色の濃さやパニック発作への効果を直接調べた研究ではありません。アプリの色モードは、画面上の色をゆっくり眺めるための設計上の参考にとどめています。</p><p><a href="https://www.jstage.jst.go.jp/article/aije/76/662/76_662_363/_article/-char/ja" target="_blank" rel="noopener">日本建築学会論文（J-STAGE）</a></p>`},
{title:'「安心できるものを選ぶ」ことと期待の働き',meta:'このアプリの設計上の考え方｜研究効果の断定ではありません',body:`<p>本人が選んだ音楽、景色、家族の写真は、「自分で選べる」「見慣れていて安心する」という感覚を支える可能性があります。研究の権威や説明を読むことで安心感が強まる人もいるかもしれませんが、本人ごとの差があり、このアプリでプラセボ効果が起きるとは保証できません。</p><p>そこで本アプリでは、大学名や研究結果を隠さず載せる一方、研究対象・方法・限界も併記します。研究が示したことと、このアプリ自体に確認された効果を混同しません。研究紹介は、掲載された方法がパニック発作を治したり、必ず短くしたりするという意味ではありません。</p>`}
];
function researchPage(){show(`<h2 id="sheetTitle">研究資料・出典</h2><div class="research-intro"><b>このページの目的</b><br>音・視覚・触覚・呼吸の関連研究を、大学名と測定結果を含めて紹介します。研究の権威を安心材料にする意図はありますが、研究結果を誇張せず、対象や限界も一緒に示します。</div><div class="research-disclaimer"><b>先に確認：</b>このアプリ自体を使った臨床試験は行っていません。以下の研究は、専用装置・訓練・照明環境などを検証したもので、このアプリで発作が早く収まることや、心拍・発汗が下がることを証明したものではありません。効果には個人差があります。</div><div id="researchList"></div><button class="stop" id="researchClose">閉じる</button>`);const list=document.getElementById('researchList');researchEntries.forEach(entry=>{const d=document.createElement('details');d.className='research-card';d.innerHTML=`<summary>${escapeHTML(entry.title)}<small>${escapeHTML(entry.meta)}</small></summary><div class="research-body">${entry.body}</div>`;list.appendChild(d)});document.getElementById('researchClose').onclick=close}
async function update(){const p=await loadPhotos();document.getElementById('photoDesc').textContent=p.length?`${p.length}件を表示・スワイプで選択`:'写真・動画を表示・2秒長押しで登録'}
openDB().then(async()=>{await del('emirinAudio');await loadListenVideos();update()}).catch(()=>{document.getElementById('photoDesc').textContent='保存機能はこのブラウザで使えません'})
})();
</script>
